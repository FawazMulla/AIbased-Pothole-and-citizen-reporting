services:
  # Backend FastAPI AI Service
  - type: web
    name: civicpothole-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: YOLO_DEVICE
        value: cpu
      - key: MODEL_PATH
        value: backend/pothole_yolov8.pt

  # Frontend Vite React Application
  - type: web
    name: civicpothole-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: civicpothole-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
