services:
  # Monolithic Web Service (FastAPI + Embedded Pre-Built React SPA + CPU-Optimized YOLOv8)
  - type: web
    name: civicpothole-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: YOLO_DEVICE
        value: cpu
      - key: MODEL_PATH
        value: backend/pothole_yolov8.pt
      - key: DATABASE_URL
        fromDatabase:
          name: civicpothole-db
          property: connectionString

databases:
  # Persistent PostgreSQL database on Render (prevents data reset on sleep/restart)
  - name: civicpothole-db
    plan: free
    region: oregon
    databaseName: civicpothole
    user: civicadmin
