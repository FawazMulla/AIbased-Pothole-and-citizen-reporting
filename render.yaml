services:
  # Unified Monolithic Service (FastAPI Backend + Built React Frontend + YOLOv8 AI)
  - type: web
    name: civicpothole-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: NODE_VERSION
        value: 20.18.0
      - key: YOLO_DEVICE
        value: cpu
      - key: MODEL_PATH
        value: backend/pothole_yolov8.pt
